<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX2 Parts | قطع غيار وإكسسوارات جيلي EX2</title>
<meta name="description" content="Spare parts, pedals and accessories for the Geely EX2 | قطع غيار ودواسات وإكسسوارات لجيلي EX2 الكهربائية">
<meta property="og:type" content="website">
<meta property="og:title" content="EX2 Parts | Geely EX2 Parts & Accessories">
<meta property="og:locale" content="ar_EG">
<meta property="og:locale:alternate" content="en_US">
<meta name="theme-color" content="#0b1f33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1f33'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffc21a' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f33;--navy2:#12304d;--ink:#101c27;--mut:#5d6b7a;--line:#e3e8ee;--bg:#f6f8fa;--yel:#ffc21a;--yel2:#f0b000;--red:#c62828;--ok:#1b7f4b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.65;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.hd{display:flex;align-items:center;gap:14px;height:64px;transition:height .3s}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;user-select:none;-webkit-user-select:none;cursor:pointer}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-weight:700;font-size:19px}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
nav.main{display:flex;gap:26px}
nav.main a{color:var(--mut);text-decoration:none;font-weight:500;font-size:14px}
nav.main a:hover{color:var(--ink)}
.lang{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.cartbtn{display:flex;align-items:center;gap:8px;border:0;background:var(--navy);color:#fff;font-weight:600;padding:9px 16px;border-radius:99px}
.cartbtn i{font-style:normal;background:var(--yel);color:#2a2100;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:12px;padding:0 6px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:#0b1f33;min-height:560px;display:flex;align-items:center}
.hbg{position:absolute;inset:-5%;background:url(images/hero.jpg) center/cover no-repeat;animation:kb 30s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-1.5%,-1%)}}
.hov{position:absolute;inset:0;background:linear-gradient(to left,rgba(8,22,38,.96) 0%,rgba(8,22,38,.88) 36%,rgba(8,22,38,.5) 70%,rgba(8,22,38,.25) 100%),linear-gradient(to top,rgba(8,22,38,.75) 0%,transparent 38%)}
[dir=ltr] .hov{background:linear-gradient(to right,rgba(8,22,38,.96) 0%,rgba(8,22,38,.88) 36%,rgba(8,22,38,.5) 70%,rgba(8,22,38,.25) 100%),linear-gradient(to top,rgba(8,22,38,.75) 0%,transparent 38%)}
.hin{position:relative;width:100%;padding-top:84px;padding-bottom:120px}
.hin>*{max-width:600px}
.eyebrow{display:inline-block;color:var(--yel);font-weight:600;font-size:12.5px;letter-spacing:1.4px;margin-bottom:14px}
.hero h1{margin:0 0 16px;font-size:clamp(30px,4.8vw,50px);line-height:1.28;font-weight:700;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero p{margin:0 0 28px;color:#d3deea;font-size:16.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:99px;padding:13px 28px;font-weight:600;font-size:15px;border:1.5px solid transparent}
.btn.y{background:var(--yel);color:#2a2100}
.btn.y:hover{background:var(--yel2);box-shadow:0 10px 24px rgba(255,194,26,.35)}
.btn.o{border-color:rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.06)}
.btn.o:hover{background:rgba(255,255,255,.16)}
.hcats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:30px}
.hcats:empty{display:none}
.hl{font-size:13px;color:#b7c7d8;margin-inline-end:4px}
.hc{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:7px 16px;font-size:13.5px;font-weight:500}
.hc:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.a1,.a2,.a3,.a4,.a5{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.a2{animation-delay:.12s}.a3{animation-delay:.24s}.a4{animation-delay:.36s}.a5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* trust */
.trust{position:relative;margin-top:-40px;z-index:2}
.trust .box{background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 8px 24px rgba(11,31,51,.08)}
.trust .it{display:flex;align-items:center;gap:12px;padding:18px 20px;font-weight:600;font-size:14.5px}
.trust .it+.it{border-inline-start:1px solid var(--line)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:#fff6dc;color:#8a6200;display:grid;place-items:center}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sections */
section{padding:64px 0 0}
.lbl{color:#8a6200;font-weight:600;font-size:13px;letter-spacing:.6px}
h2{margin:4px 0 6px;font-size:clamp(22px,3.2vw,32px);line-height:1.35}
.sub{color:var(--mut);margin:0}
#products{scroll-margin-top:80px}
.ctrl{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:22px 0 20px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:14px;font-weight:500;color:var(--mut)}
.pill:hover{border-color:#b9c5d1}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sbox{flex:0 1 280px;min-width:200px}
.sbox input{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:#fff}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(11,31,51,.1)}
.pimg{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eef2f6,#e4eaf0);display:grid;place-items:center;color:#97a6b6;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:74px;height:74px}
.card.out .pimg img,.card.out .pimg svg{filter:grayscale(1);opacity:.5}
.tagb{position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px}
.tagb.d{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.pcat{font-size:12px;color:#8a6200;font-weight:600}
.cb h3{margin:2px 0 4px;font-size:16px;line-height:1.5}
.pd{margin:0;font-size:13px;color:var(--mut);flex:1}
.pf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pr{font-weight:700;font-size:19px}
.pr small{font-weight:500;font-size:12px;color:var(--mut);margin-inline-start:3px}
.add{border:0;background:var(--navy);color:#fff;border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px}
.add:hover:not(:disabled){background:var(--navy2)}
.add:disabled{background:#d5dce3;color:#8a98a8;cursor:not-allowed}
.empty{padding:50px 0;text-align:center;color:var(--mut);grid-column:1/-1}

/* why */
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.why .c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.why h3{margin:14px 0 6px;font-size:17px}
.why p{margin:0;color:var(--mut);font-size:14px}

/* footer */
footer{margin-top:72px;background:var(--navy);color:#a9bccd}
.ft{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:30px 18px}
.ft .brand b{color:#fff}.ft .brand small{color:#a9bccd}
.ft a{color:var(--yel);text-decoration:none;font-weight:500}
.copy{border-top:1px solid rgba(255,255,255,.1);text-align:center;font-size:12.5px;padding:14px;color:#7f93a8}
.fwa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:15;background:#25d366;color:#04210f;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}

/* cart */
.shade{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:30;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.shade.show{opacity:1;visibility:visible}
.panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:#fff;z-index:31;transform:translateX(102%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.7,.2,1),visibility .34s;display:flex;flex-direction:column}
[dir=ltr] .panel{transform:translateX(-102%)}
.panel.show,[dir=ltr] .panel.show{transform:none;visibility:visible}
.ph2{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ph2 h2{margin:0;font-size:19px}
.xb{border:0;background:none;font-size:28px;line-height:1;color:var(--mut)}
.pb{flex:1;overflow:auto;padding:6px 18px 20px}
.ln{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ln .n{flex:1;font-size:14px;font-weight:500}
.ln .n small{display:block;color:var(--mut);font-weight:400}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:99px}
.qty button{border:0;background:none;width:32px;height:32px;font-size:17px}
.qty span{min-width:22px;text-align:center}
.sum{display:flex;justify-content:space-between;padding:10px 0 2px;font-weight:500}
.sum.big{font-weight:700;font-size:18px;padding-top:6px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid #cbd4dd;border-radius:10px;background:#fff}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.hp{position:absolute;inset-inline-start:-9999px;height:0;overflow:hidden}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.go{display:block;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:14px;font-weight:700;font-size:16px;margin-top:8px}
.go:disabled{opacity:.6;cursor:wait}
.go.y{background:var(--yel);color:#2a2100}
.go.ghost{background:#fff;color:var(--ink);border:1px solid #cbd4dd}
.done{text-align:center;padding:44px 8px}
.done .ck{width:60px;height:60px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
.done .no{display:inline-block;margin:10px 0;padding:6px 16px;background:var(--bg);border:1px dashed #9fb0c0;border-radius:8px;font-weight:700;direction:ltr}
.toast{position:fixed;bottom:22px;inset-inline:16px;margin:auto;max-width:360px;background:#16222d;color:#fff;padding:11px 16px;border-radius:10px;z-index:99;text-align:center;font-size:14px;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .3s,transform .3s,visibility .3s}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.bad{background:var(--red)}

/* لوحة التحكم (عربي دايمًا) */
.adm{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.adm.show{display:flex}
.ah{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ah button{border:1px solid #5b7389;background:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.at{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.at button{flex:1;border:0;background:none;padding:12px 4px;border-bottom:3px solid transparent;color:var(--mut);font-weight:500}
.at button.on{color:var(--ink);border-bottom-color:var(--yel);font-weight:700}
.ab{flex:1;overflow:auto;padding:14px 16px 60px;max-width:700px;width:100%;margin:auto}
.ar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.ar.hid{opacity:.6}
.ar .top{display:flex;gap:10px;align-items:center}
.ar .th{flex:none;width:52px;height:52px;border-radius:8px;background:#e9eef3;overflow:hidden;display:grid;place-items:center;color:#7d8da0;font-size:11px}
.ar .th img{width:100%;height:100%;object-fit:cover}
.ar .nm{flex:1;min-width:0}
.ar .nm small{display:block;color:var(--mut);font-size:12px}
.ar .acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.ar .acts button{border:1px solid #cbd4dd;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px}
.ar .acts .dng{border-color:var(--red);color:var(--red)}
.ar .acts label{margin:0;display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:13px}
.ar .acts input[type=number]{width:70px;padding:6px 8px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:#eef2f6;color:var(--mut)}
.tag.z{background:#fde7e7;color:var(--red)}
.bar2{display:flex;gap:8px;margin-bottom:12px}
.bar2 input{flex:1}
.bar2 button{border:0;background:var(--yel);color:#2a2100;font-weight:700;border-radius:10px;padding:0 16px;white-space:nowrap}
.mod{position:fixed;inset:0;background:rgba(10,20,30,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.mod.show{display:flex}
.mod .sh{background:#fff;width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.mod h3{margin:0 0 4px}
.prev{width:100px;height:100px;border-radius:10px;background:#e9eef3;overflow:hidden;display:grid;place-items:center;color:#7d8da0;font-size:12px}
.prev img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.en{margin-top:14px;padding:10px 12px;background:#f3f6f9;border-radius:10px}
.en b{font-size:13px}
.ord{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;font-size:14px}
.ord .hd2{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ord pre{white-space:pre-wrap;font-family:inherit;margin:6px 0;color:var(--mut);font-size:13px}
.ord a{color:var(--navy);font-weight:700}
.sec{font-weight:700;margin:22px 0 4px}

/* حركات وانتقالات */
.trust .box{animation:up .9s .55s cubic-bezier(.2,.7,.2,1) backwards}
.rv{opacity:0}
.rv.in{opacity:1;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0s)}
.card{animation:up .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
.pimg img,.pimg svg{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:not(.out):hover .pimg img{transform:scale(1.07)}
.card:not(.out):hover .pimg svg{transform:scale(1.12)}
.why .c{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.why .c:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(11,31,51,.1);border-color:#cfd8e2}
.why .c:hover .ic{background:var(--yel);color:#2a2100}
.ic{transition:background .3s,color .3s}
.btn,.add,.go,.cartbtn,.lang,.pill,.hc{transition:background .2s,color .2s,border-color .2s,transform .18s,box-shadow .25s}
.btn:active,.add:active,.go:active,.cartbtn:active,.lang:active,.pill:active,.hc:active{transform:scale(.96)}
.cartbtn:hover,.lang:hover{transform:translateY(-1px)}
.cartbtn i.bump{animation:bump .45s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
header.sc{box-shadow:0 6px 22px rgba(11,31,51,.1)}
header.sc .hd{height:56px}

@media (max-width:820px){
  nav.main{display:none}
  .hero{min-height:0}
  .hin{padding-top:52px;padding-bottom:88px}
  .hov,[dir=ltr] .hov{background:linear-gradient(rgba(8,22,38,.84),rgba(8,22,38,.7)),linear-gradient(to top,rgba(8,22,38,.7) 0%,transparent 40%)}
  .trust .box{grid-template-columns:1fr}
  .trust .it+.it{border-inline-start:0;border-top:1px solid var(--line)}
  .why{grid-template-columns:1fr}
  section{padding-top:48px}
}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .cb{padding:11px 12px 13px}
  .cb h3{font-size:14px}
  .pd{display:none}
  .pr{font-size:16px}
  .add{padding:8px 12px;font-size:13px}
  .pf{flex-wrap:wrap}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.a1,.a2,.a3,.a4,.a5{opacity:1}}
</style>
</head>
<body id="top">
<header><div class="wrap hd">
  <div class="brand" id="logo"><div class="mark">E</div><div><b id="bname">EX2 Parts</b><small data-t="tag">Geely EX2</small></div></div>
  <nav class="main"><a href="#top" data-t="nav_home"></a><a href="#products" data-t="nav_products"></a><a href="#contact" data-t="nav_contact"></a></nav>
  <button class="lang" id="langBtn" aria-label="Language">EN</button>
  <button class="cartbtn" id="cartBtn"><span data-t="cart"></span><i id="cnt">0</i></button>
</div></header>

<div class="hero">
  <div class="hbg"></div><div class="hov"></div>
  <div class="wrap hin">
    <span class="eyebrow a1" data-t="eyebrow"></span>
    <h1 class="a2" data-t="h1"></h1>
    <p class="a3" data-t="hsub"></p>
    <div class="btns a4"><a class="btn y" href="#products" data-t="cta1"></a><a class="btn o" href="#contact" data-t="cta2"></a></div>
    <div class="hcats a5" id="hcats"></div>
  </div>
</div>

<div class="wrap trust"><div class="box">
  <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg></span><span data-t="tr1"></span></div>
  <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span><span data-t="tr2"></span></div>
  <div class="it"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span><span data-t="tr3"></span></div>
</div></div>

<section id="products"><div class="wrap">
  <div class="lbl rv" data-t="plabel"></div>
  <h2 class="rv" style="--d:.08s" data-t="ptitle"></h2>
  <p class="sub rv" style="--d:.16s" data-t="psub"></p>
  <div class="ctrl rv" style="--d:.24s">
    <div class="pills" id="tabs"></div>
    <div class="sbox"><input id="q" type="search" data-tp="search" aria-label="search"></div>
  </div>
  <div class="grid" id="list"></div>
</div></section>

const GOVS=[["القاهرة","Cairo"],["الجيزة","Giza"],["الإسكندرية","Alexandria"],["القليوبية","Qalyubia"],["الدقهلية","Dakahlia"],["الشرقية","Sharqia"],["الغربية","Gharbia"],["المنوفية","Monufia"],["البحيرة","Beheira"],["كفر الشيخ","Kafr El Sheikh"],["دمياط","Damietta"],["بورسعيد","Port Said"],["الإسماعيلية","Ismailia"],["السويس","Suez"],["الفيوم","Fayoum"],["بني سويف","Beni Suef"],["المنيا","Minya"],["أسيوط","Asyut"],["سوهاج","Sohag"],["قنا","Qena"],["الأقصر","Luxor"],["أسوان","Aswan"],["البحر الأحمر","Red Sea"],["الوادي الجديد","New Valley"],["مطروح","Matrouh"],["شمال سيناء","North Sinai"],["جنوب سيناء","South Sinai"]];

let lang=localStorage.getItem("ex2lang")||"ar";
let DATA={settings:{},products:[]},cat="all",term="",cart={},A={pw:"",tab:"p",d:null,q:""},loaded=false;
try{cart=JSON.parse(localStorage.getItem("ex2cart")||"{}")}catch(e){}
const $=i=>document.getElementById(i);
const t=k=>T[lang][k]||T.ar[k]||"";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US");
const sp=s=>{const a=String(s||"").split("|");return{ar:(a[0]||"").trim(),en:(a[1]||"").trim()}};
const loc=s=>{const x=sp(s);return lang==="en"&&x.en?x.en:(x.ar||x.en)};
const byCode=c=>DATA.products.find(p=>p.code===c);
const ICON='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30l4-12a4 4 0 0 1 4-3h20a4 4 0 0 1 4 3l4 12v8H6z"/><circle cx="14" cy="34" r="2.5"/><circle cx="34" cy="34" r="2.5"/></svg>';
const imgTag=(u,alt)=>/^https:\/\//.test(u||"")?`<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy">`:ICON;
let tt;function toast(m,bad){const e=$("toast");e.textContent=m;e.className="toast show"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>e.className="toast",2600)}
const saveCart=()=>{try{localStorage.setItem("ex2cart",JSON.stringify(cart))}catch(e){}};
async function post(body){
  const r=await fetch(URL_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return await r.json();
}

/* ====== اللغة ====== */
function setLang(l){
  lang=l;try{localStorage.setItem("ex2lang",l)}catch(e){}
  const h=document.documentElement;h.lang=l;h.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp));
  $("langBtn").textContent=l==="ar"?"EN":"عربي";
  $("ptitle2").textContent=t("ctitle");
  document.title=((DATA.settings&&DATA.settings.name)||"EX2 Parts")+(l==="ar"?" | قطع غيار وإكسسوارات جيلي EX2":" | Geely EX2 Parts & Accessories");
  render();
  if($("panel").classList.contains("show"))drawCart();
}
$("langBtn").onclick=()=>setLang(lang==="ar"?"en":"ar");

/* ====== المتجر ====== */
async function loadData(){
  if(URL_API.indexOf("PASTE")===0){$("list").innerHTML=`<div class="empty">${t("setup")}</div>`;return}
  try{const c=localStorage.getItem("ex2data");if(c){DATA=JSON.parse(c);loaded=true;sanitizeCart();render()}}catch(e){}
  try{
    const r=await fetch(URL_API+"?action=data",{cache:"no-store"});
    const j=await r.json();if(!j.ok)throw 0;
    DATA=j;loaded=true;try{localStorage.setItem("ex2data",JSON.stringify(j))}catch(e){}
    sanitizeCart();render();
  }catch(e){
    if(!loaded)$("list").innerHTML=`<div class="empty">${t("loadfail")}</div>`;
  }
}
function sanitizeCart(){
  for(const c of Object.keys(cart)){const p=byCode(c);if(!p||p.stock<=0)delete cart[c];else if(cart[c]>p.stock)cart[c]=p.stock}
  saveCart();
}
function render(){
  const s=DATA.settings||{};
  const nm=s.name||"EX2 Parts";
  $("bname").textContent=nm;$("fname").textContent=nm;$("fname2").textContent=nm;$("yr").textContent=new Date().getFullYear();
  const ct=[];
  if(s.phone)ct.push(t("phone")+': <a href="tel:'+esc(s.phone)+'" dir="ltr">'+esc(s.phone)+'</a>');
  if(s.wa)ct.push('<a href="https://wa.me/'+esc(s.wa)+'" target="_blank" rel="noopener">'+t("wa")+'</a>');
  $("contactl").innerHTML=ct.join(" &nbsp;|&nbsp; ");
  const fw=$("fwa");fw.textContent=t("wa");if(s.wa){fw.href="https://wa.me/"+s.wa;fw.style.display="block"}else fw.style.display="none";
  const cats=["all"].concat([...new Set(DATA.products.map(p=>p.cat).filter(Boolean))]);
  if(!cats.includes(cat))cat="all";
  $("tabs").innerHTML=cats.map(c=>`<button class="pill${c===cat?" on":""}" data-c="${esc(c)}">${c==="all"?t("all"):esc(loc(c))}</button>`).join("");
  [...$("tabs").children].forEach(b=>b.onclick=()=>{cat=b.dataset.c;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));drawList()});
  drawList();count();heroCats(cats);
}
function heroCats(cats){
  const c=cats.filter(x=>x!=="all");
  $("hcats").innerHTML=c.length?`<span class="hl">${t("shopby")}</span>`+c.map(x=>`<button class="hc" data-c="${esc(x)}">${esc(loc(x))}</button>`).join(""):"";
  $("hcats").querySelectorAll(".hc").forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();$("products").scrollIntoView({behavior:"smooth"})});
}
function drawList(){
  if(!loaded&&!DATA.products.length){$("list").innerHTML=`<div class="empty">${URL_API.indexOf("PASTE")===0?t("setup"):t("loading")}</div>`;return}
  const items=DATA.products.filter(p=>(cat==="all"||p.cat===cat)&&(!term||(p.name+" "+p.desc+" "+p.cat).toLowerCase().includes(term.toLowerCase())));
  if(!items.length){$("list").innerHTML=`<div class="empty">${t("none")}</div>`;return}
  $("list").innerHTML=items.map((p,i)=>{
    const out=p.stock<=0;
    const badge=out?`<span class="tagb d">${t("outb")}</span>`:(p.stock<=5?`<span class="tagb">${t("left").replace("{n}",fmt(p.stock))}</span>`:"");
    return `<article class="card${out?" out":""}" style="--i:${Math.min(i,10)}"><div class="pimg">${imgTag(p.img,loc(p.name))}${badge}</div><div class="cb"><div class="pcat">${esc(loc(p.cat))}</div><h3>${esc(loc(p.name))}</h3><p class="pd">${esc(loc(p.desc))}</p><div class="pf"><div class="pr">${fmt(p.price)}<small>${t("cur")}</small></div><button class="add" data-c="${esc(p.code)}"${out?" disabled":""}>${out?t("out"):t("add")}</button></div></div></article>`}).join("");
  document.querySelectorAll(".add:not(:disabled)").forEach(b=>b.onclick=()=>{
    const p=byCode(b.dataset.c),n=(cart[p.code]||0)+1;
    if(n>p.stock){toast(t("max"),1);return}
    cart[p.code]=n;saveCart();count();bump();b.textContent=t("added");setTimeout(()=>{b.textContent=t("add")},900)});
}
const totals=()=>{let s=0,c=0;for(const k in cart){const p=byCode(k);if(p){s+=p.price*cart[k];c+=cart[k]}}return{t:s,c}};
const count=()=>{$("cnt").textContent=fmt(totals().c)};
$("q").oninput=function(){term=this.value.trim();drawList()};

/* --- السلة --- */
const openCart=()=>{$("shade").classList.add("show");$("panel").classList.add("show");drawCart()};
const closeCart=()=>{$("shade").classList.remove("show");$("panel").classList.remove("show")};
$("cartBtn").onclick=openCart;$("close").onclick=closeCart;$("shade").onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
function drawCart(){
  $("ptitle2").textContent=t("ctitle");
  const ids=Object.keys(cart).filter(byCode);
  if(!ids.length){$("pb").innerHTML=`<div class="empty">${t("empty")}</div>`;return}
  const ship=Number((DATA.settings||{}).ship)||0,sub=totals().t;
  let h=ids.map(id=>{const p=byCode(id);return `<div class="ln"><div class="n">${esc(loc(p.name))}<small>${fmt(p.price)} ${t("per")}</small></div><div class="qty"><button data-a="1" data-id="${esc(id)}" aria-label="+">+</button><span>${fmt(cart[id])}</span><button data-a="-1" data-id="${esc(id)}" aria-label="-">&minus;</button></div></div>`}).join("");
  h+=`<div class="sum"><span>${t("sub")}</span><span>${fmt(sub)} ${t("cur")}</span></div>`;
  h+=`<div class="sum"><span>${t("ship")}</span><span>${ship>0?fmt(ship)+" "+t("cur"):t("shipTbd")}</span></div>`;
  h+=`<div class="sum big"><span>${t("total")}</span><span>${fmt(sub+ship)} ${t("cur")}</span></div>`;
  h+=`<label for="nm">${t("f_name")}</label><input id="nm" autocomplete="name">`;
  h+=`<label for="ph">${t("f_phone")}</label><input id="ph" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" dir="ltr" style="text-align:start">`;
  h+=`<label for="gv">${t("f_gov")}</label><select id="gv"><option value="">${t("f_gov0")}</option>`+GOVS.map(g=>`<option value="${g[0]}">${lang==="en"?g[1]:g[0]}</option>`).join("")+`</select>`;
  h+=`<label for="ad">${t("f_addr")}</label><textarea id="ad" rows="2" autocomplete="street-address"></textarea>`;
  h+=`<label for="nt">${t("f_notes")}</label><textarea id="nt" rows="2"></textarea>`;
  h+=`<div class="hp"><label>Leave empty<input id="web" tabindex="-1" autocomplete="off"></label></div>`;
  h+=`<div class="err" id="err" role="alert"></div><button class="go" id="go">${t("confirm")}</button>`;
  $("pb").innerHTML=h;
  try{const c=JSON.parse(localStorage.getItem("ex2cust")||"{}");if(c.nm)$("nm").value=c.nm;if(c.ph)$("ph").value=c.ph;if(c.gv)$("gv").value=c.gv;if(c.ad)$("ad").value=c.ad}catch(e){}
  $("pb").querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,p=byCode(id);let n=cart[id]+Number(b.dataset.a);
    if(n>p.stock){toast(t("max"),1);return}
    if(n<=0)delete cart[id];else cart[id]=n;saveCart();count();drawCart()});
  $("go").onclick=submit;
}
const err=m=>{$("err").textContent=m;return false};
function serverMsg(r){
  if(lang==="ar"&&r.msg)return r.msg;
  if(r.code==="closed")return t("e_closed");
  if(r.code==="unavail")return t("e_unavail");
  if(r.code==="stock"){const n=loc(r.name);return r.left>0?t("e_left").replace("{n}",r.left).replace("{name}",n):t("e_sold").replace("{name}",n)}
  return r.msg&&lang==="ar"?r.msg:t("e_fail");
}
async function submit(){
  if($("web").value)return;
  const nm=$("nm").value.trim(),ph=$("ph").value.trim().replace(/[\s-]/g,""),gv=$("gv").value,ad=$("ad").value.trim(),nt=$("nt").value.trim();
  if(nm.length<3)return err(t("e_name"));
  if(!/^01[0125][0-9]{8}$/.test(ph))return err(t("e_phone"));
  if(!gv)return err(t("e_gov"));
  if(ad.length<8)return err(t("e_addr"));
  const btn=$("go");btn.disabled=true;btn.textContent=t("sending");err("");
  try{
    const r=await post({action:"order",name:nm,phone:ph,gov:gv,address:ad,notes:nt,items:Object.keys(cart).map(c=>({code:c,qty:cart[c]}))});
    if(r.ok){try{localStorage.setItem("ex2cust",JSON.stringify({nm,ph,gv,ad}))}catch(e){}cart={};saveCart();count();done(r.id,ph);loadData()}
    else{btn.disabled=false;btn.textContent=t("confirm");err(serverMsg(r));loadData()}
  }catch(e){btn.disabled=false;btn.textContent=t("confirm");err(t("e_conn"))}
}
function done(id,ph){
  $("ptitle2").textContent=t("done_t");
  $("pb").innerHTML=`<div class="done"><div class="ck">&#10003;</div><h2>${t("done_t")}</h2><p>${t("done_no")}</p><div class="no">${esc(id)}</div><p>${esc(t("done_msg").replace("{phone}",ph))}</p><button class="go" id="back">${t("back")}</button></div>`;
  $("back").onclick=closeCart;
}

/* ====== لوحة التحكم (مخفية - عربي دايمًا) ====== */
let taps=0,tapT;
$("logo").onclick=()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,2500);if(taps>=5){taps=0;openAdmin()}};
addEventListener("hashchange",()=>{if(location.hash==="#admin")openAdmin()});
if(location.hash==="#admin")setTimeout(openAdmin,300);
function openAdmin(){
  history.replaceState(null,"",location.pathname+location.search);
  $("adm").classList.add("show");
  const pw=sessionStorage.getItem("ex2pw");
  if(pw){A.pw=pw;adminLoad()}else loginView();
}
function closeAdmin(){$("adm").classList.remove("show");$("mod").classList.remove("show");loadData()}
function loginView(){
  $("adm").innerHTML=`<div class="ah"><b>دخول الإدارة</b><button id="x1">إغلاق</button></div><div class="ab"><label for="apw">كلمة المرور</label><input id="apw" type="password" autocomplete="current-password"><div class="err" id="aerr"></div><button class="go" id="alog">دخول</button></div>`;
  $("x1").onclick=closeAdmin;
  const go=async()=>{A.pw=$("apw").value;$("alog").disabled=true;if(!await adminLoad(true))$("alog").disabled=false};
  $("alog").onclick=go;$("apw").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function adminLoad(fromLogin){
  try{
    const r=await post({action:"adminData",pw:A.pw});
    if(!r.ok){
      sessionStorage.removeItem("ex2pw");
      if(fromLogin&&$("aerr"))$("aerr").textContent=r.msg||"تعذر الدخول";else loginView();
      return false;
    }
    A.d=r;sessionStorage.setItem("ex2pw",A.pw);adminView();return true;
  }catch(e){
    if($("aerr"))$("aerr").textContent="مشكلة في الاتصال. جرب تاني.";else{toast("مشكلة في الاتصال",1);loginView()}
    return false;
  }
}
function adminView(){
  const nw=A.d.orders.filter(o=>o.status==="جديد").length;
  $("adm").innerHTML=`<div class="ah"><b>لوحة التحكم</b><div><button id="lo">خروج</button> <button id="cl">إغلاق</button></div></div><div class="at"><button data-tab="p">المنتجات</button><button data-tab="o">الطلبات${nw?" ("+nw+")":""}</button><button data-tab="s">الإعدادات</button></div><div class="ab" id="abody"></div>`;
  $("cl").onclick=closeAdmin;
  $("lo").onclick=()=>{sessionStorage.removeItem("ex2pw");A.pw="";closeAdmin()};
  document.querySelectorAll(".at button").forEach(b=>{b.classList.toggle("on",b.dataset.tab===A.tab);b.onclick=()=>{A.tab=b.dataset.tab;adminView()}});
  ({p:prodTab,o:ordTab,s:setTab})[A.tab]();
}

/* --- المنتجات --- */
function prodTab(){
  const q=A.q.trim(),L=A.d.products.filter(p=>!q||(p.name+p.cat).includes(q));
  let h=`<div class="bar2"><input id="pq" placeholder="ابحث في المنتجات" value="${esc(A.q)}"><button id="padd">+ إضافة منتج</button></div>`;
  h+=L.length?L.map(p=>`<div class="ar${p.show?"":" hid"}" data-c="${esc(p.code)}"><div class="top"><div class="th">${/^https:\/\//.test(p.img)?`<img src="${esc(p.img)}" alt="">`:"بدون صورة"}</div><div class="nm"><b>${esc(sp(p.name).ar)}</b><small>${esc(sp(p.cat).ar)} | ${fmt(p.price)} جنيه</small></div><span class="tag${p.stock<=0?" z":""}">${p.stock<=0?"نفد":"المتاح: "+fmt(p.stock)}</span></div><div class="acts"><button data-a="e">تعديل</button><button data-a="v">${p.show?"إخفاء":"إظهار"}</button><button class="dng" data-a="d">حذف</button><label>الكمية <input type="number" min="0" inputmode="numeric" value="${p.stock}" data-a="s"></label></div></div>`).join(""):'<div class="empty">مفيش منتجات. اضغط إضافة منتج.</div>';
  $("abody").innerHTML=h;
  $("pq").oninput=function(){A.q=this.value;const pos=this.selectionStart;prodTab();const n=$("pq");n.focus();n.setSelectionRange(pos,pos)};
  $("padd").onclick=()=>prodForm();
  $("abody").querySelectorAll(".ar").forEach(el=>{
    const p=A.d.products.find(x=>x.code===el.dataset.c);
    el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==="e")prodForm(p);
      if(a==="v")saveProd({...p,show:!p.show},p.show?"تم إخفاء المنتج":"تم إظهار المنتج");
      if(a==="d"&&confirm('حذف "'+sp(p.name).ar+'" نهائيًا؟')){
        const r=await post({action:"deleteProduct",pw:A.pw,code:p.code});
        if(r.ok){toast("تم الحذف");await adminLoad()}else toast(r.msg||"تعذر الحذف",1)}
    });
    el.querySelector("input[data-a=s]").onchange=function(){saveProd({...p,stock:Math.max(0,parseInt(this.value)||0)},"تم تحديث الكمية")};
  });
}
async function saveProd(p,msg){
  try{
    const r=await post({action:"saveProduct",pw:A.pw,product:p});
    if(r.ok){toast(msg||"تم الحفظ");$("mod").classList.remove("show");await adminLoad();return true}
    toast(r.msg||"تعذر الحفظ",1);
  }catch(e){toast("مشكلة في الاتصال",1)}
  return false;
}
const join2=(a,b)=>a+(b?" | "+b:"");
function prodForm(p){
  p=p||{};const cats=[...new Set(A.d.products.map(x=>sp(x.cat).ar).filter(Boolean))];
  const n=sp(p.name),c=sp(p.cat),d=sp(p.desc);let imgData="",img=p.img||"";
  $("modb").innerHTML=`<h3>${p.code?"تعديل منتج":"إضافة منتج"}</h3>
  <label>اسم المنتج</label><input id="fn" value="${esc(n.ar)}">
  <label>القسم (اختار أو اكتب قسم جديد)</label><input id="fc" list="cl" value="${esc(c.ar)}"><datalist id="cl">${cats.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
  <div class="two"><div><label>السعر (جنيه)</label><input id="fp" type="number" min="0" inputmode="decimal" value="${p.price||""}"></div><div><label>الكمية المتاحة</label><input id="fs" type="number" min="0" inputmode="numeric" value="${p.stock==null?"":p.stock}"></div></div>
  <label>وصف قصير (اختياري)</label><input id="fd" value="${esc(d.ar)}">
  <div class="en"><b>النسخة الإنجليزية (اختياري)</b>
  <label>Product name</label><input id="fne" dir="ltr" value="${esc(n.en)}">
  <label>Category</label><input id="fce" dir="ltr" value="${esc(c.en)}">
  <label>Short description</label><input id="fde" dir="ltr" value="${esc(d.en)}"></div>
  <label>صورة المنتج</label><div style="display:flex;gap:12px;align-items:center"><div class="prev" id="pv">${/^https:\/\//.test(img)?`<img src="${esc(img)}" alt="">`:"بدون صورة"}</div><div><input id="ff" type="file" accept="image/*"></div></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fv" ${p.show===false?"":"checked"}> ظاهر في المتجر</label>
  <div class="err" id="ferr"></div><button class="go y" id="fsv">حفظ</button><button class="go ghost" id="fcn">إلغاء</button>`;
  $("mod").classList.add("show");
  $("fcn").onclick=()=>$("mod").classList.remove("show");
  $("ff").onchange=async function(){
    const f=this.files[0];if(!f)return;
    try{imgData=await shrink(f);img="";$("pv").innerHTML=`<img src="${imgData}" alt="">`}catch(e){$("ferr").textContent="تعذر قراءة الصورة"}
  };
  $("fsv").onclick=async()=>{
    const name=$("fn").value.trim(),price=Number($("fp").value),stock=$("fs").value;
    if(name.length<2)return $("ferr").textContent="اكتب اسم المنتج";
    if(!(price>0))return $("ferr").textContent="اكتب السعر";
    if(stock==="")return $("ferr").textContent="اكتب الكمية المتاحة";
    const bad=[$("fn"),$("fc"),$("fd"),$("fne"),$("fce"),$("fde")].some(e=>e.value.indexOf("|")>-1);
    if(bad)return $("ferr").textContent="ممنوع استخدام علامة | في الكتابة";
    $("fsv").disabled=true;$("fsv").textContent="جاري الحفظ...";
    const ok=await saveProd({code:p.code||"",name:join2(name,$("fne").value.trim()),cat:join2($("fc").value.trim()||"أخرى",$("fce").value.trim()),desc:join2($("fd").value.trim(),$("fde").value.trim()),price,stock:Math.max(0,parseInt(stock)||0),img,imgData,show:$("fv").checked});
    if(!ok){$("fsv").disabled=false;$("fsv").textContent="حفظ"}
  };
}
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.82))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* --- الطلبات --- */
function ordTab(){
  const O=A.d.orders,ST=A.d.statuses;
  $("abody").innerHTML=O.length?O.map(o=>`<div class="ord"><div class="hd2"><span>${esc(o.id)}</span><span>${fmt(o.total)} جنيه</span></div><div style="color:var(--mut);font-size:12px">${esc(o.when)}</div><div>${esc(o.name)} - <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div><div>${esc(o.gov)} | ${esc(o.address)}</div><pre>${esc(o.items)}</pre>${o.notes?`<div>ملاحظات: ${esc(o.notes)}</div>`:""}<label>حالة الطلب</label><select data-id="${esc(o.id)}" data-old="${esc(o.status)}">${ST.map(s=>`<option${s===o.status?" selected":""}>${s}</option>`).join("")}</select></div>`).join(""):'<div class="empty">لسه مفيش طلبات.</div>';
  $("abody").querySelectorAll("select").forEach(s=>s.onchange=async()=>{
    if(s.value==="ملغي"&&!confirm("إلغاء الطلب هيرجّع الكميات للمخزون. متأكد؟")){s.value=s.dataset.old;return}
    const r=await post({action:"setStatus",pw:A.pw,id:s.dataset.id,status:s.value});
    if(r.ok){toast("تم تحديث الحالة");await adminLoad()}else{toast(r.msg||"تعذر التحديث",1);s.value=s.dataset.old}
  });
}

/* --- الإعدادات --- */
function setTab(){
  const s=A.d.settings;
  const f=(k,l,ty)=>`<label>${l}</label><input data-k="${k}" ${ty||""} value="${esc(s[k]||"")}">`;
  $("abody").innerHTML=`${f("name","اسم المتجر")}${f("phone","رقم التليفون (يظهر للعملاء)",'inputmode="tel"')}${f("wa","رقم الواتساب بصيغة دولية مثال 201012345678",'inputmode="tel"')}${f("ship","مصاريف الشحن بالجنيه (0 = يتحدد في المكالمة)",'type="number" min="0" inputmode="numeric"')}
  <label>استقبال الطلبات</label><select data-k="open"><option value="نعم"${s.open==="لا"?"":" selected"}>شغال</option><option value="لا"${s.open==="لا"?" selected":""}>متوقف مؤقتًا</option></select>
  <button class="go y" id="ssv" style="margin-top:14px">حفظ</button>
  <div class="sec">تغيير كلمة المرور</div><label>كلمة المرور الجديدة (6 على الأقل)</label><input id="np" type="password" autocomplete="new-password"><label>تأكيد كلمة المرور</label><input id="np2" type="password" autocomplete="new-password"><div class="err" id="perr"></div><button class="go" id="psv">تغيير كلمة المرور</button>`;
  $("ssv").onclick=async()=>{
    const o={};document.querySelectorAll("[data-k]").forEach(e=>o[e.dataset.k]=e.value);
    const r=await post({action:"saveSettings",pw:A.pw,settings:o});
    if(r.ok){toast("تم الحفظ");await adminLoad()}else toast(r.msg||"تعذر الحفظ",1)};
  $("psv").onclick=async()=>{
    const a=$("np").value,b=$("np2").value;
    if(a.length<6)return $("perr").textContent="كلمة المرور قصيرة";
    if(a!==b)return $("perr").textContent="كلمتا المرور غير متطابقتين";
    const r=await post({action:"changePw",pw:A.pw,newPw:a});
    if(r.ok){A.pw=a;sessionStorage.setItem("ex2pw",a);$("np").value=$("np2").value="";$("perr").textContent="";toast("تم تغيير كلمة المرور")}else $("perr").textContent=r.msg||"تعذر التغيير"};
}

function bump(){const e=$("cnt");e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
addEventListener("scroll",()=>document.querySelector("header").classList.toggle("sc",scrollY>12),{passive:true});
(function(){
  const els=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
  els.forEach(e=>io.observe(e));
})();
setLang(lang);
loadData();
</script>
