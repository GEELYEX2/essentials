*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.65;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.hd{display:flex;align-items:center;gap:14px;height:64px;transition:height .3s}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;user-select:none;-webkit-user-select:none;cursor:pointer}
.mark{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--yel);display:grid;place-items:center;font-weight:700;font-size:19px}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--mut);line-height:1.2}
nav.main{display:flex;gap:26px}
nav.main a{color:var(--mut);text-decoration:none;font-weight:500;font-size:14px}
nav.main a:hover{color:var(--ink)}
.lang{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.cartbtn{display:flex;align-items:center;gap:8px;border:0;background:var(--navy);color:#fff;font-weight:600;padding:9px 16px;border-radius:99px}
.cartbtn i{font-style:normal;background:var(--yel);color:#2a2100;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:12px;padding:0 6px}

@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-1.5%,-1%)}}
.hov{position:absolute;inset:0;background:linear-gradient(to left,rgba(8,22,38,.97) 0%,rgba(8,22,38,.9) 38%,rgba(8,22,38,.55) 70%,rgba(8,22,38,.3) 100%),linear-gradient(to top,rgba(8,22,38,.75) 0%,transparent 38%)}
[dir=ltr] .hov{background:linear-gradient(to right,rgba(8,22,38,.96) 0%,rgba(8,22,38,.88) 36%,rgba(8,22,38,.5) 70%,rgba(8,22,38,.25) 100%),linear-gradient(to top,rgba(8,22,38,.75) 0%,transparent 38%)}
.hin{position:relative;width:100%;padding-top:84px;padding-bottom:120px}
.hin>*{max-width:600px}
.eyebrow{display:inline-block;color:var(--yel);font-weight:600;font-size:12.5px;letter-spacing:1.4px;margin-bottom:14px}
.hero h1{margin:0 0 16px;font-size:clamp(30px,4.8vw,50px);line-height:1.28;font-weight:700;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero p{margin:0 0 28px;color:#d3deea;font-size:16.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;border-radius:99px;padding:13px 28px;font-weight:600;font-size:15px;border:1.5px solid transparent}
.btn.y{background:var(--yel);color:#2a2100}
.btn.y:hover{background:var(--yel2);box-shadow:0 10px 24px rgba(255,194,26,.35)}
.btn.o{border-color:rgba(255,255,255,.45);color:#fff;background:rgba(255,255,255,.06)}
.btn.o:hover{background:rgba(255,255,255,.16)}
.hcats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:30px}
.hcats:empty{display:none}
.hl{font-size:13px;color:#b7c7d8;margin-inline-end:4px}
.hc{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:7px 16px;font-size:13.5px;font-weight:500}
.hc:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.a1,.a2,.a3,.a4,.a5{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.a2{animation-delay:.12s}.a3{animation-delay:.24s}.a4{animation-delay:.36s}.a5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* trust */
.trust{position:relative;margin-top:-40px;z-index:2}
.trust .box{background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 8px 24px rgba(11,31,51,.08)}
.trust .it{display:flex;align-items:center;gap:12px;padding:18px 20px;font-weight:600;font-size:14.5px}
.trust .it+.it{border-inline-start:1px solid var(--line)}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:#fff6dc;color:#8a6200;display:grid;place-items:center}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* sections */
section{padding:64px 0 0}
.lbl{color:#8a6200;font-weight:600;font-size:13px;letter-spacing:.6px}
h2{margin:4px 0 6px;font-size:clamp(22px,3.2vw,32px);line-height:1.35}
.sub{color:var(--mut);margin:0}
#products{scroll-margin-top:80px}
.ctrl{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:22px 0 20px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:14px;font-weight:500;color:var(--mut)}
.pill:hover{border-color:#b9c5d1}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sbox{flex:0 1 280px;min-width:200px}
.sbox input{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:#fff}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(11,31,51,.1)}
.pimg{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eef2f6,#e4eaf0);display:grid;place-items:center;color:#97a6b6;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:74px;height:74px}
.card.out .pimg img,.card.out .pimg svg{filter:grayscale(1);opacity:.5}
.tagb{position:absolute;top:12px;inset-inline-start:12px;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px}
.tagb.d{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.pcat{font-size:12px;color:#8a6200;font-weight:600}
.cb h3{margin:2px 0 4px;font-size:16px;line-height:1.5}
.pd{margin:0;font-size:13px;color:var(--mut);flex:1}
.pf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pr{font-weight:700;font-size:19px}
.pr small{font-weight:500;font-size:12px;color:var(--mut);margin-inline-start:3px}
.add{border:0;background:var(--navy);color:#fff;border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px}
.add:hover:not(:disabled){background:var(--navy2)}
.add:disabled{background:#d5dce3;color:#8a98a8;cursor:not-allowed}
.empty{padding:50px 0;text-align:center;color:var(--mut);grid-column:1/-1}

/* why */
.why{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;margin-top:26px}
.why .c{grid-column:span 2}
.why .c:nth-child(n+4){grid-column:span 3}
.why .c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.why h3{margin:14px 0 6px;font-size:17px}
.why p{margin:0;color:var(--mut);font-size:14px}

/* footer */
footer{margin-top:72px;background:var(--navy);color:#a9bccd}
.ft{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:30px 18px}
.ft .brand b{color:#fff}.ft .brand small{color:#a9bccd}
.ft a{color:var(--yel);text-decoration:none;font-weight:500}
.copy{border-top:1px solid rgba(255,255,255,.1);text-align:center;font-size:12.5px;padding:14px;color:#7f93a8}

function drawCart(){
  $("ptitle2").textContent=t("ctitle");
  const ids=Object.keys(cart).filter(byCode);
  if(!ids.length){$("pb").innerHTML=`<div class="empty">${t("empty")}</div>`;return}
  const ship=Number((DATA.settings||{}).ship)||0,sub=totals().t;
  let h=ids.map(id=>{const p=byCode(id);return `<div class="ln"><div class="n">${esc(loc(p.name))}<small>${fmt(p.price)} ${t("per")}</small></div><div class="qty"><button data-a="1" data-id="${esc(id)}" aria-label="+">+</button><span>${fmt(cart[id])}</span><button data-a="-1" data-id="${esc(id)}" aria-label="-">&minus;</button></div></div>`}).join("");
  h+=`<div class="sum"><span>${t("sub")}</span><span>${fmt(sub)} ${t("cur")}</span></div>`;
  h+=`<div class="sum"><span>${t("ship")}</span><span>${ship>0?fmt(ship)+" "+t("cur"):t("shipTbd")}</span></div>`;
  h+=`<div class="sum big"><span>${t("total")}</span><span>${fmt(sub+ship)} ${t("cur")}</span></div>`;
  h+=`<label for="nm">${t("f_name")}</label><input id="nm" autocomplete="name">`;
  h+=`<label for="ph">${t("f_phone")}</label><input id="ph" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" dir="ltr" style="text-align:start">`;
  h+=`<label for="gv">${t("f_gov")}</label><select id="gv"><option value="">${t("f_gov0")}</option>`+GOVS.map(g=>`<option value="${g[0]}">${lang==="en"?g[1]:g[0]}</option>`).join("")+`</select>`;
  h+=`<label for="ad">${t("f_addr")}</label><textarea id="ad" rows="2" autocomplete="street-address"></textarea>`;
  h+=`<label for="nt">${t("f_notes")}</label><textarea id="nt" rows="2"></textarea>`;
  h+=`<div class="hp"><label>Leave empty<input id="web" tabindex="-1" autocomplete="off"></label></div>`;
  h+=`<div class="err" id="err" role="alert"></div><button class="go" id="go">${t("confirm")}</button>`;
  $("pb").innerHTML=h;
  try{const c=JSON.parse(localStorage.getItem("ex2cust")||"{}");if(c.nm)$("nm").value=c.nm;if(c.ph)$("ph").value=c.ph;if(c.gv)$("gv").value=c.gv;if(c.ad)$("ad").value=c.ad}catch(e){}
  $("pb").querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,p=byCode(id);let n=cart[id]+Number(b.dataset.a);
    if(n>p.stock){toast(t("max"),1);return}
    if(n<=0)delete cart[id];else cart[id]=n;saveCart();count();drawCart()});
  $("go").onclick=submit;
}
const err=m=>{$("err").textContent=m;return false};
function serverMsg(r){
  if(lang==="ar"&&r.msg)return r.msg;
  if(r.code==="closed")return t("e_closed");
  if(r.code==="unavail")return t("e_unavail");
  if(r.code==="stock"){const n=loc(r.name);return r.left>0?t("e_left").replace("{n}",r.left).replace("{name}",n):t("e_sold").replace("{name}",n)}
  return r.msg&&lang==="ar"?r.msg:t("e_fail");
}
async function submit(){
  if($("web").value)return;
  const nm=$("nm").value.trim(),ph=$("ph").value.trim().replace(/[\s-]/g,""),gv=$("gv").value,ad=$("ad").value.trim(),nt=$("nt").value.trim();
  if(nm.length<3)return err(t("e_name"));
  if(!/^01[0125][0-9]{8}$/.test(ph))return err(t("e_phone"));
  if(!gv)return err(t("e_gov"));
  if(ad.length<8)return err(t("e_addr"));
  const btn=$("go");btn.disabled=true;btn.textContent=t("sending");err("");
  try{
    const r=await post({action:"order",name:nm,phone:ph,gov:gv,address:ad,notes:nt,items:Object.keys(cart).map(c=>({code:c,qty:cart[c]}))});
    if(r.ok){try{localStorage.setItem("ex2cust",JSON.stringify({nm,ph,gv,ad}))}catch(e){}cart={};saveCart();count();done(r.id,ph);loadData()}
    else{btn.disabled=false;btn.textContent=t("confirm");err(serverMsg(r));loadData()}
  }catch(e){btn.disabled=false;btn.textContent=t("confirm");err(t("e_conn"))}
}
function done(id,ph){
  DONE={id,ph};
  $("ptitle2").textContent=t("done_t");
  $("pb").innerHTML=`<div class="done"><div class="ck">&#10003;</div><h2>${t("done_t")}</h2><p>${t("done_no")}</p><div class="no">${esc(id)}</div><p>${esc(t("done_msg").replace("{phone}",ph))}</p><button class="go y" id="trkgo">${t("done_trk")}</button><button class="go ghost" id="back">${t("back")}</button></div>`;
  $("back").onclick=closeCart;
  try{localStorage.setItem("ex2last",JSON.stringify({id,ph}))}catch(e){}
  $("trkgo").onclick=()=>{closeCart();$("tid").value=id;$("tph").value=ph;openTrack();trackGo()};
}

async function saveProd(p,msg){

const join2=(a,b)=>a+(b?" | "+b:"");
function vidNorm(s){
  s=String(s||"").trim();
  if(!/^https:\/\//.test(s))return null;
  let m=s.match(/(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  if(m)return{t:"v",u:"https://www.youtube.com/embed/"+m[1]};
  m=s.match(/^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#\s]*&)?id=)([\w-]+)/);
  if(m)return{t:"v",u:"https://drive.google.com/file/d/"+m[1]+"/preview"};
  if(/^https:\/\/\S+\.(mp4|webm|mov)(\?\S*)?$/i.test(s))return{t:"f",u:s};
  return null;
}
function prodForm(p){
  p=p||{};
  const cmap=Object.create(null);

  const cats=Object.keys(cmap),NEWC="__new__",MAXM=8;
  const n=sp(p.name),c=sp(p.cat),d=sp(p.desc);
  const items=[];
  if(/^https:\/\//.test(p.img||""))items.push({t:"i",u:p.img});
  (Array.isArray(p.media)?p.media:[]).forEach(m=>{if(m&&m.u&&(m.t==="i"||m.t==="v"||m.t==="f"))items.push({t:m.t,u:m.u})});
  $("modb").innerHTML=`<h3>${p.code?"تعديل منتج":"إضافة منتج"}</h3>
  <label>اسم المنتج</label><input id="fn" value="${esc(n.ar)}">
  <label>القسم</label><select id="fcs"><option value="">اختار القسم...</option>${cats.map(x=>`<option value="${esc(x)}"${x===c.ar?" selected":""}>${esc(x)}</option>`).join("")}<option value="${NEWC}">+ قسم جديد...</option></select>
  <div id="cnw" style="display:none"><label>اسم القسم الجديد</label><input id="fc"><label>Category name (English - اختياري)</label><input id="fce" dir="ltr"></div>
  <div class="two"><div><label>السعر (جنيه)</label><input id="fp" type="number" min="0" inputmode="decimal" value="${p.price||""}"></div><div><label>الكمية المتاحة</label><input id="fs" type="number" min="0" inputmode="numeric" value="${p.stock==null?"":p.stock}"></div></div>
  <label>وصف قصير (اختياري)</label><input id="fd" value="${esc(d.ar)}">
  <div class="en"><b>النسخة الإنجليزية (اختياري)</b>
  <label>Product name</label><input id="fne" dir="ltr" value="${esc(n.en)}">
  <label>Short description</label><input id="fde" dir="ltr" value="${esc(d.en)}"></div>
  <label>صور وفيديوهات المنتج (لحد ${MAXM} - أول صورة هي الغلاف اللي بتظهر على الكارت)</label>
  <div class="mg" id="mg"></div>
  <label>إضافة صور (ممكن تختار أكتر من صورة)</label><input id="ff" type="file" accept="image/*" multiple>
  <label>إضافة فيديو من الجهاز (MP4 أو WebM أو MOV - لحد 10 ميجا)</label><input id="fvf" type="file" accept="video/mp4,video/webm,video/quicktime">
  <label>أو رابط فيديو (يوتيوب أو درايف أو ملف mp4 مباشر)</label><div class="bar2"><input id="fvl" dir="ltr" placeholder="https://..."><button type="button" id="fva">إضافة</button></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fv" ${p.show===false?"":"checked"}> ظاهر في المتجر</label>
  <div class="err" id="ferr"></div><button class="go y" id="fsv">حفظ</button><button class="go ghost" id="fcn">إلغاء</button>`;
  $("mod").classList.add("show");
  $("fcn").onclick=()=>$("mod").classList.remove("show");
  const syncCat=()=>{$("cnw").style.display=$("fcs").value===NEWC?"block":"none"};
  $("fcs").onchange=syncCat;syncCat();
  const drawMg=()=>{
    const ci=items.findIndex(m=>m.t==="i");
    $("mg").innerHTML=items.length?items.map((m,k)=>`<div class="mt${k===ci?" cv":""}"><div class="mth">${m.t==="i"?`<img src="${esc(m.data||m.u)}" alt="">`:(m.t==="vf"?"فيديو<br>(ملف)":"فيديو")}</div><span class="cvt">${k===ci?"الغلاف":""}</span><div class="mb">${m.t==="i"?`<button type="button" data-m="f" data-i="${k}" title="اجعلها الغلاف"${k===ci?" disabled":""}>&#9733;</button>`:""}<button type="button" data-m="x" data-i="${k}" title="حذف">&times;</button></div></div>`).join(""):'<small style="color:var(--mut)">مفيش صور أو فيديوهات لسه.</small>';
    $("mg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const k=Number(b.dataset.i);
      if(b.dataset.m==="x")items.splice(k,1);else items.unshift(items.splice(k,1)[0]);
      drawMg();
    });
  };
  drawMg();
  const full=()=>{if(items.length>=MAXM){$("ferr").textContent="وصلت للحد الأقصى ("+MAXM+")";return true}return false};
  $("ff").onchange=async function(){
    const fs=[...this.files];this.value="";$("ferr").textContent="";
    for(const f of fs){
      if(full())break;
      try{items.push({t:"i",data:await shrink(f)})}catch(e){$("ferr").textContent="تعذر قراءة إحدى الصور"}
    }
    drawMg();
  };
  $("fvf").onchange=function(){
    const f=this.files[0];this.value="";$("ferr").textContent="";
    if(!f||full())return;
    if(!/^video\/(mp4|webm|quicktime)$/.test(f.type)){$("ferr").textContent="نوع الفيديو لازم يكون MP4 أو WebM أو MOV";return}
    if(f.size>10*1024*1024){$("ferr").textContent="الفيديو أكبر من 10 ميجا. ارفعه على يوتيوب وحط الرابط.";return}
    const fr=new FileReader();
    fr.onerror=()=>{$("ferr").textContent="تعذر قراءة الفيديو"};
    fr.onload=()=>{items.push({t:"vf",data:fr.result});drawMg()};
    fr.readAsDataURL(f);
  };
  $("fva").onclick=()=>{
    $("ferr").textContent="";
    const v=$("fvl").value.trim();if(!v||full())return;
    const m=vidNorm(v);
    if(!m){$("ferr").textContent="الرابط ده مش مدعوم. استخدم رابط يوتيوب أو درايف أو ملف mp4 مباشر";return}
    items.push(m);$("fvl").value="";drawMg();

    if(name.length<2)return $("ferr").textContent="اكتب اسم المنتج";
    let catAr,catEn;
    if($("fcs").value===NEWC){
      catAr=$("fc").value.trim();catEn=$("fce").value.trim();
      if(!catAr)return $("ferr").textContent="اكتب اسم القسم الجديد";
    }else{
      catAr=$("fcs").value;
      if(!catAr)return $("ferr").textContent="اختار القسم";
      catEn=cmap[catAr]||"";
    }
    if(!(price>0))return $("ferr").textContent="اكتب السعر";
    if(stock==="")return $("ferr").textContent="اكتب الكمية المتاحة";
    const bad=[$("fn"),$("fc"),$("fd"),$("fne"),$("fce"),$("fde")].some(e=>e.value.indexOf("|")>-1);
    if(bad)return $("ferr").textContent="ممنوع استخدام علامة | في الكتابة";
    $("fsv").disabled=true;$("fsv").textContent="جاري الرفع والحفظ...";
    const media=items.map(m=>m.data?{t:m.t,data:m.data}:{t:m.t,u:m.u});
    const ok=await saveProd({code:p.code||"",name:join2(name,$("fne").value.trim()),cat:join2(catAr,catEn),desc:join2($("fd").value.trim(),$("fde").value.trim()),price,stock:Math.max(0,parseInt(stock)||0),img:"",media,show:$("fv").checked});
    if(!ok){$("fsv").disabled=false;$("fsv").textContent="حفظ"}
  };
}
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const m=1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.82))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

    if(a.length<6)return $("perr").textContent="كلمة المرور قصيرة";

function bump(){const e=$("cnt");e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}
addEventListener("scroll",()=>document.querySelector("header").classList.toggle("sc",scrollY>12),{passive:true});
(function(){
  const els=document.querySelectorAll(".rv");
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
  els.forEach(e=>io.observe(e));
})();

let PD=null,GI=0;
const bigImg=u=>String(u).replace(/sz=w\d+/,"sz=w1200");
function addOne(p){const n=(cart[p.code]||0)+1;if(n>p.stock){toast(t("max"),1);return false}cart[p.code]=n;saveCart();count();bump();return true}
function drawProd(){
  const p=byCode(PD);if(!p){closeProd();return}
  const out=p.stock<=0,has=/^https:\/\//.test(p.img||""),d=loc(p.desc);
  const st=out?`<span class="stk z">${t("out")}</span>`:(p.stock<=5?`<span class="stk w">${t("left").replace("{n}",fmt(p.stock))}</span>`:`<span class="stk">${t("instock")}</span>`);
  $("pdb").innerHTML=`<div class="pdin"><div class="pdimg${out?" out":""}" id="galw"></div><div class="pdinfo"><div class="pcat">${esc(loc(p.cat))}</div><h2>${esc(loc(p.name))}</h2><div class="pdp">${fmt(p.price)}<small>${t("cur")}</small></div>${st}${d?`<p class="pdd">${esc(d)}</p>`:""}<button class="go y" id="pdo"${out?" disabled":""}>${out?t("out"):t("ordnow")}</button><button class="go ghost" id="pda"${out?" disabled":""}>${t("add")}</button></div></div>`;
  drawGal(p);
  if(!out){
    $("pdo").onclick=()=>{const had=cart[p.code]>0;if(addOne(p)||had){closeProd();openCart()}};
    $("pda").onclick=()=>{if(addOne(p))toast(t("added"))};
  }
}

function drawGal(p){
  const box=$("galw");if(!box)return;
  const g=gallery(p);
  if(!g.length){box.innerHTML=ICON;return}
  if(GI>=g.length||GI<0)GI=0;
  const cur=g[GI],many=g.length>1,nm=esc(loc(p.name));
  let main;
  if(cur.t==="i")main=`<img src="${esc(bigImg(cur.u))}" alt="${nm}">`;
  else if(cur.t==="v")main=`<iframe src="${esc(cur.u)}" title="${nm}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  else main=`<video src="${esc(cur.u)}" controls playsinline preload="metadata"></video>`;
  const nav=many?`<button class="gnav gp" id="gprev" aria-label="prev">&#8249;</button><button class="gnav gn" id="gnext" aria-label="next">&#8250;</button><span class="gcnt">${GI+1} / ${g.length}</span>`:"";
  const ths=many?`<div class="gth">`+g.map((m,i)=>`<button class="gt${i===GI?" on":""}" data-i="${i}" aria-label="${i+1}">${m.t==="i"?`<img src="${esc(m.u)}" alt="" loading="lazy">`:`<span class="gv">&#9654;</span>`}</button>`).join("")+`</div>`:"";
  box.innerHTML=`<div class="gal" dir="ltr"><div class="gmain" id="gmain">${main}${nav}</div>${ths}</div>`;
  if(many){
    const go=i=>{GI=(i+g.length)%g.length;drawGal(p)};
    $("gprev").onclick=()=>go(GI-1);
    $("gnext").onclick=()=>go(GI+1);
    box.querySelectorAll(".gt").forEach(b=>b.onclick=()=>go(Number(b.dataset.i)));
    let x0=null;const gm=$("gmain");
    gm.ontouchstart=e=>{x0=e.touches[0].clientX};
    gm.ontouchend=e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45)go(dx<0?GI+1:GI-1)};
  }
}
function openProd(c){PD=c;GI=0;drawProd();$("pshade").classList.add("show");$("pdlg").classList.add("show");$("pdlg").scrollTop=0}
function closeProd(){PD=null;$("pshade").classList.remove("show");$("pdlg").classList.remove("show")}
$("pdx").onclick=closeProd;$("pshade").onclick=closeProd;
addEventListener("keydown",e=>{if(e.key==="Escape")closeProd()});
addEventListener("keydown",e=>{
  if(!PD||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"))return;
  const p=byCode(PD);if(!p)return;const g=gallery(p);if(g.length<2)return;
  GI=(GI+(e.key==="ArrowRight"?1:-1)+g.length)%g.length;drawGal(p);
});
$("list").onclick=e=>{if(e.target.closest(".add"))return;const c=e.target.closest(".card");if(c)openProd(c.dataset.c)};
$("list").onkeydown=e=>{if(e.key==="Enter"&&!e.target.closest(".add")){const c=e.target.closest(".card");if(c)openProd(c.dataset.c)}};

document.querySelectorAll("img.lg").forEach(i=>i.src=LOGO);
document.querySelector('link[rel=icon]').href=LOGO;
let TR=null,DONE=null;
const trItems=x=>String(x||"").split("\n").map(l=>{const m=l.match(/(\d+)\s*\u00d7\s*(.+?)\s*\u2014\s*(\S+)\s*$/),p=m&&byCode(m[3]);return p?(lang==="ar"?"\u200F":"")+m[1]+" \u00d7 "+loc(p.name)+" \u2014 "+m[3]:l}).join("\n");
const STEPS=["جديد","تم التأكيد","تم الشحن","تم التسليم"],SK=["st_new","st_conf","st_ship","st_deliv"];
function drawTrack(){
  const box=$("tres");if(!TR){box.innerHTML="";return}
  const r=TR,i=Math.max(0,STEPS.indexOf(r.status));
  let h=`<div class="tcard"><div class="thd"><b dir="ltr">${esc(r.id)}</b><span>${esc(r.when)}</span></div>`;
  if(r.status==="ملغي")h+=`<div class="tcan">${t("st_canc")}<small>${t("trk_cm")}</small></div>`;
  else h+=`<ol class="steps">`+STEPS.map((s,k)=>`<li class="${k<=i?"ok":""}${k===i&&i<3?" cur":""}"><span>${k<=i?"&#10003;":k+1}</span>${t(SK[k])}</li>`).join("")+`</ol>`;
  h+=`<pre>${esc(trItems(r.items))}</pre><div class="sum big"><span>${t("total")}</span><span>${fmt(r.total)} ${t("cur")}</span></div></div>`;
  box.innerHTML=h;
}
async function trackGo(){
  const id=$("tid").value.trim(),ph=$("tph").value.trim().replace(/[\s-]/g,"");
  if(!id||!ph)return $("terr").textContent=t("trk_e");
  $("terr").textContent="";const b=$("tgo");b.disabled=true;b.textContent=t("trk_w");
  try{
    const r=await post({action:"track",id,phone:ph});
    if(r.ok){TR=r;drawTrack()}
    else{TR=null;drawTrack();$("terr").textContent=r.code==="locked"?t("trk_lock"):t("trk_nf")}
  }catch(e){$("terr").textContent=t("e_conn")}
  b.disabled=false;b.textContent=t("trk_btn");
}
function openTrack(){$("tshade").classList.add("show");$("tdlg").classList.add("show");setTimeout(()=>{if(!TR)$("tid").focus()},250)}
function closeTrack(){$("tshade").classList.remove("show");$("tdlg").classList.remove("show")}
$("trkBtn").onclick=openTrack;$("tclose").onclick=closeTrack;$("tshade").onclick=closeTrack;
addEventListener("keydown",e=>{if(e.key==="Escape")closeTrack()});
$("tgo").onclick=trackGo;
[$("tid"),$("tph")].forEach(e=>e.onkeydown=ev=>{if(ev.key==="Enter")trackGo()});
try{const l=JSON.parse(localStorage.getItem("ex2last")||"{}");if(l.id)$("tid").value=l.id;if(l.ph)$("tph").value=l.ph}catch(e){}

setLang(lang);
loadData();
