<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX2 Parts | قطع غيار وإكسسوارات جيلي EX2</title>
<meta name="description" content="قطع غيار ودواسات وإكسسوارات لسيارة جيلي EX2 الكهربائية. اطلب أونلاين وهنكلمك لتأكيد الطلب.">
<meta name="theme-color" content="#0f2a43">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f2a43'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffc21a' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a43;--ink:#16222d;--mut:#617182;--line:#dde3e9;--bg:#f4f6f8;--yel:#ffc21a;--red:#c62828;--ok:#1b7f4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
.hd{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;margin-inline-end:auto;user-select:none;-webkit-user-select:none}
.logo small{display:block;font-weight:400;font-size:12px;color:#a9bccd}
.srch{flex:1 1 100%;order:3}
.srch input{width:100%;padding:10px 14px;border:0;border-radius:6px;background:#fff}
.cartbtn{border:0;background:var(--yel);color:#2a2100;font-weight:700;padding:10px 16px;border-radius:6px}
main{max-width:1000px;margin:auto;padding:0 16px 90px}
.intro{padding:20px 0 6px}
.intro h1{margin:0 0 4px;font-size:22px;line-height:1.4}
.intro p{margin:0;color:var(--mut)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 0;color:var(--mut);white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--yel);font-weight:700}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row{background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;gap:14px;padding:12px}
.row.out{opacity:.65}
.ph{flex:none;width:96px;height:96px;border-radius:4px;background:#e9eef3;display:grid;place-items:center;color:#7d8da0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:44px;height:44px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info h3{margin:0;font-size:15px;line-height:1.5}
.info .d{margin:2px 0 0;font-size:13px;color:var(--mut)}
.low{font-size:12px;color:var(--red);font-weight:500}
.buy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:16px}
.price span{font-weight:400;font-size:12px;color:var(--mut)}
.add{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:7px 14px;font-weight:500}
.add:hover:not(:disabled){background:var(--ink);color:#fff}
.add:disabled{border-color:#b9c3cd;color:#8a98a8;cursor:not-allowed}
.empty{padding:40px 0;text-align:center;color:var(--mut);grid-column:1/-1}
footer{background:var(--navy);color:#a9bccd;text-align:center;padding:20px 16px;font-size:13px}
footer b{color:#fff}
footer a{color:var(--yel);text-decoration:none}
.fwa{position:fixed;bottom:16px;inset-inline-end:16px;z-index:9;background:#25d366;color:#04210f;font-weight:700;text-decoration:none;padding:11px 18px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none}
.shade{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:30;display:none}
.shade.show{display:block}
.panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:#fff;z-index:31;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column}
.panel.show{transform:none}
.ph2{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph2 h2{margin:0;font-size:18px}
.xb{border:0;background:none;font-size:26px;line-height:1;color:var(--mut)}
.pb{flex:1;overflow:auto;padding:6px 16px 16px}
.ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .n{flex:1;font-size:14px}
.ln .n small{display:block;color:var(--mut)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{border:0;background:none;width:30px;height:30px;font-size:17px}
.qty span{min-width:22px;text-align:center}
.sum{display:flex;justify-content:space-between;padding:10px 0 2px;font-weight:500}
.sum.big{font-weight:700;font-size:17px;padding-top:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #c5ced8;border-radius:6px;background:#fff}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.hp{position:absolute;inset-inline-start:-9999px;height:0;overflow:hidden}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.go{display:block;width:100%;border:0;border-radius:6px;background:var(--navy);color:#fff;padding:13px;font-weight:700;font-size:16px;margin-top:8px}
.go:disabled{opacity:.6;cursor:wait}
.go.y{background:var(--yel);color:#2a2100}
.go.ghost{background:#fff;color:var(--ink);border:1px solid #c5ced8}
.done{text-align:center;padding:40px 10px}
.done .ck{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:30px}
.done .no{display:inline-block;margin:10px 0;padding:6px 14px;background:var(--bg);border:1px dashed #9fb0c0;border-radius:6px;font-weight:700;direction:ltr}
.toast{position:fixed;bottom:20px;inset-inline:16px;margin:auto;max-width:360px;background:#16222d;color:#fff;padding:11px 16px;border-radius:6px;z-index:99;text-align:center;font-size:14px;display:none}
.toast.show{display:block}
.toast.bad{background:var(--red)}
/* لوحة التحكم */
.adm{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.adm.show{display:flex}
.ah{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ah button{border:1px solid #5b7389;background:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
.at{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.at button{flex:1;border:0;background:none;padding:12px 4px;border-bottom:3px solid transparent;color:var(--mut);font-weight:500}
.at button.on{color:var(--ink);border-bottom-color:var(--yel);font-weight:700}
.ab{flex:1;overflow:auto;padding:14px 16px 60px;max-width:700px;width:100%;margin:auto}
.ar{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:10px}
.ar.hid{opacity:.6}
.ar .top{display:flex;gap:10px;align-items:center}
.ar .th{flex:none;width:52px;height:52px;border-radius:4px;background:#e9eef3;overflow:hidden;display:grid;place-items:center;color:#7d8da0;font-size:11px}
.ar .th img{width:100%;height:100%;object-fit:cover}
.ar .nm{flex:1;min-width:0}
.ar .nm small{display:block;color:var(--mut);font-size:12px}
.ar .acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.ar .acts button{border:1px solid #c5ced8;background:#fff;border-radius:6px;padding:6px 12px;font-size:13px}
.ar .acts .dng{border-color:var(--red);color:var(--red)}
.ar .acts label{margin:0;display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:13px}
.ar .acts input[type=number]{width:70px;padding:6px 8px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:#eef2f6;color:var(--mut)}
.tag.z{background:#fde7e7;color:var(--red)}
.bar2{display:flex;gap:8px;margin-bottom:12px}
.bar2 input{flex:1}
.bar2 button{border:0;background:var(--yel);color:#2a2100;font-weight:700;border-radius:6px;padding:0 16px;white-space:nowrap}
.mod{position:fixed;inset:0;background:rgba(10,20,30,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.mod.show{display:flex}
.mod .sh{background:#fff;width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:12px 12px 0 0;padding:16px}
.mod h3{margin:0 0 4px}
.prev{width:100px;height:100px;border-radius:6px;background:#e9eef3;overflow:hidden;display:grid;place-items:center;color:#7d8da0;font-size:12px}
.prev img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ord{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;font-size:14px}
.ord .hd2{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ord pre{white-space:pre-wrap;font-family:inherit;margin:6px 0;color:var(--mut);font-size:13px}
.ord a{color:var(--navy);font-weight:700}
.sec{font-weight:700;margin:22px 0 4px}
@media (max-width:760px){.list{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo"><span id="logo">EX2 Parts</span><small>قطع غيار وإكسسوارات جيلي EX2</small></div>
  <button class="cartbtn" id="cartBtn">السلة (<span id="cnt">0</span>)</button>
  <div class="srch"><input id="q" type="search" placeholder="ابحث عن قطعة أو إكسسوار" aria-label="بحث"></div>
</div></header>

<main>
  <section class="intro"><h1>كل اللي محتاجه لعربيتك جيلي EX2</h1><p>اختار اللي عايزه واكتب بياناتك، وهنكلمك نأكد الطلب والتوصيل. الدفع عند الاستلام.</p></section>
  <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
  <section class="list" id="list"><div class="empty">جاري تحميل المنتجات...</div></section>
</main>
<footer><div><b id="fname">EX2 Parts</b></div><div id="contact"></div></footer>
<a class="fwa" id="fwa" target="_blank" rel="noopener">واتساب</a>

<div class="shade" id="shade"></div>
<aside class="panel" id="panel" aria-label="السلة">
  <div class="ph2"><h2 id="ptitle">سلة الطلب</h2><button class="xb" id="close" aria-label="إغلاق">&times;</button></div>
  <div class="pb" id="pb"></div>
</aside>
<div class="toast" id="toast"></div>

<div class="adm" id="adm"></div>
<div class="mod" id="mod"><div class="sh" id="modb"></div></div>

<script>
/* ====== الإعداد الوحيد المطلوب في الملف ====== */
const URL_API = "PASTE_YOUR_SHEET_URL_HERE";   // لينك Google Apps Script (ينتهي بـ /exec)

let DATA={settings:{},products:[]},cat="all",term="",cart={},A={pw:"",tab:"p",d:null,q:""};
try{cart=JSON.parse(localStorage.getItem("ex2cart")||"{}")}catch(e){}
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("ar-EG");
const byCode=c=>DATA.products.find(p=>p.code===c);
const ICON='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30l4-12a4 4 0 0 1 4-3h20a4 4 0 0 1 4 3l4 12v8H6z"/><circle cx="14" cy="34" r="2.5"/><circle cx="34" cy="34" r="2.5"/></svg>';
const imgTag=(u,alt)=>/^https:\/\//.test(u||"")?`<img src="${esc(u)}" alt="${esc(alt)}" loading="lazy">`:ICON;
let tt;function toast(m,bad){const t=$("toast");t.textContent=m;t.className="toast show"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>t.className="toast",2600)}
const saveCart=()=>{try{localStorage.setItem("ex2cart",JSON.stringify(cart))}catch(e){}};
async function post(body){
  const r=await fetch(URL_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return await r.json();
}

/* ====== المتجر ====== */
async function loadData(){
  if(URL_API.indexOf("PASTE")===0){$("list").innerHTML='<div class="empty">الموقع لسه تحت الإعداد.</div>';return}
  try{const c=localStorage.getItem("ex2data");if(c)apply(JSON.parse(c))}catch(e){}
  try{
    const r=await fetch(URL_API+"?action=data",{cache:"no-store"});
    const j=await r.json();if(!j.ok)throw 0;
    apply(j);try{localStorage.setItem("ex2data",JSON.stringify(j))}catch(e){}
  }catch(e){
    if(!DATA.products.length)$("list").innerHTML='<div class="empty">تعذر تحميل المنتجات. تأكد من الإنترنت وحدّث الصفحة.</div>';
  }
}
function apply(j){
  DATA=j;const s=j.settings||{};
  $("logo").textContent=s.name||"EX2 Parts";$("fname").textContent=s.name||"EX2 Parts";
  const ct=[];
  if(s.phone)ct.push('تليفون: <a href="tel:'+esc(s.phone)+'">'+esc(s.phone)+'</a>');
  if(s.wa)ct.push('<a href="https://wa.me/'+esc(s.wa)+'" target="_blank" rel="noopener">واتساب</a>');
  $("contact").innerHTML=ct.join(" &nbsp;|&nbsp; ");
  const fw=$("fwa");if(s.wa){fw.href="https://wa.me/"+s.wa;fw.style.display="block"}else fw.style.display="none";
  for(const c of Object.keys(cart)){const p=byCode(c);if(!p||p.stock<=0)delete cart[c];else if(cart[c]>p.stock)cart[c]=p.stock}
  saveCart();
  const cats=["all"].concat([...new Set(DATA.products.map(p=>p.cat).filter(Boolean))]);
  if(!cats.includes(cat))cat="all";
  $("tabs").innerHTML=cats.map(c=>`<button data-c="${esc(c)}"${c===cat?' class="on"':''}>${c==="all"?"كل المنتجات":esc(c)}</button>`).join("");
  [...$("tabs").children].forEach(b=>b.onclick=()=>{cat=b.dataset.c;[...$("tabs").children].forEach(x=>x.classList.toggle("on",x===b));drawList()});
  drawList();count();
}
function drawList(){
  const items=DATA.products.filter(p=>(cat==="all"||p.cat===cat)&&(!term||(p.name+" "+p.desc+" "+p.cat).includes(term)));
  if(!items.length){$("list").innerHTML='<div class="empty">مفيش منتجات مطابقة.</div>';return}
  $("list").innerHTML=items.map(p=>{
    const out=p.stock<=0;
    return `<article class="row${out?" out":""}"><div class="ph">${imgTag(p.img,p.name)}</div><div class="info"><h3>${esc(p.name)}</h3><p class="d">${esc(p.desc)}</p>${!out&&p.stock<=5?`<span class="low">متبقي ${fmt(p.stock)} فقط</span>`:""}<div class="buy"><div class="price">${fmt(p.price)} <span>جنيه</span></div><button class="add" data-c="${esc(p.code)}"${out?" disabled":""}>${out?"نفد من المخزون":"أضف للسلة"}</button></div></div></article>`}).join("");
  document.querySelectorAll(".add:not(:disabled)").forEach(b=>b.onclick=()=>{
    const p=byCode(b.dataset.c),n=(cart[p.code]||0)+1;
    if(n>p.stock){toast("وصلت للحد الأقصى المتاح من هذا المنتج",1);return}
    cart[p.code]=n;saveCart();count();b.textContent="تمت الإضافة";setTimeout(()=>{b.textContent="أضف للسلة"},900)});
}
const totals=()=>{let t=0,c=0;for(const k in cart){const p=byCode(k);if(p){t+=p.price*cart[k];c+=cart[k]}}return{t,c}};
const count=()=>{$("cnt").textContent=fmt(totals().c)};
$("q").oninput=function(){term=this.value.trim();drawList()};

/* --- السلة --- */
const openCart=()=>{$("shade").classList.add("show");$("panel").classList.add("show");drawCart()};
const closeCart=()=>{$("shade").classList.remove("show");$("panel").classList.remove("show")};
$("cartBtn").onclick=openCart;$("close").onclick=closeCart;$("shade").onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
const GOVS=["القاهرة","الجيزة","الإسكندرية","القليوبية","الدقهلية","الشرقية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح","شمال سيناء","جنوب سيناء"];
function drawCart(){
  $("ptitle").textContent="سلة الطلب";
  const ids=Object.keys(cart).filter(byCode);
  if(!ids.length){$("pb").innerHTML='<div class="empty">السلة فاضية. أضف منتجات من القائمة.</div>';return}
  const ship=Number((DATA.settings||{}).ship)||0,sub=totals().t;
  let h=ids.map(id=>{const p=byCode(id);return `<div class="ln"><div class="n">${esc(p.name)}<small>${fmt(p.price)} جنيه للقطعة</small></div><div class="qty"><button data-a="1" data-id="${esc(id)}" aria-label="زيادة">+</button><span>${fmt(cart[id])}</span><button data-a="-1" data-id="${esc(id)}" aria-label="نقصان">&minus;</button></div></div>`}).join("");
  h+=`<div class="sum"><span>المنتجات</span><span>${fmt(sub)} جنيه</span></div>`;
  h+=ship>0?`<div class="sum"><span>الشحن</span><span>${fmt(ship)} جنيه</span></div>`:`<div class="sum"><span>الشحن</span><span>يتحدد في المكالمة</span></div>`;
  h+=`<div class="sum big"><span>الإجمالي</span><span>${fmt(sub+ship)} جنيه</span></div>`;
  h+='<label for="nm">الاسم بالكامل</label><input id="nm" autocomplete="name">';
  h+='<label for="ph">رقم الموبايل</label><input id="ph" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">';
  h+='<label for="gv">المحافظة</label><select id="gv"><option value="">اختار المحافظة</option>'+GOVS.map(g=>`<option>${g}</option>`).join("")+'</select>';
  h+='<label for="ad">العنوان بالتفصيل</label><textarea id="ad" rows="2" autocomplete="street-address"></textarea>';
  h+='<label for="nt">ملاحظات (اختياري)</label><textarea id="nt" rows="2"></textarea>';
  h+='<div class="hp"><label>لا تملأ هذا الحقل<input id="web" tabindex="-1" autocomplete="off"></label></div>';
  h+='<div class="err" id="err" role="alert"></div><button class="go" id="go">تأكيد الطلب</button>';
  $("pb").innerHTML=h;
  try{const c=JSON.parse(localStorage.getItem("ex2cust")||"{}");if(c.nm)$("nm").value=c.nm;if(c.ph)$("ph").value=c.ph;if(c.gv)$("gv").value=c.gv;if(c.ad)$("ad").value=c.ad}catch(e){}
  $("pb").querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id,p=byCode(id);let n=cart[id]+Number(b.dataset.a);
    if(n>p.stock){toast("وصلت للحد الأقصى المتاح",1);return}
    if(n<=0)delete cart[id];else cart[id]=n;saveCart();count();drawCart()});
  $("go").onclick=submit;
}
const err=m=>{$("err").textContent=m;return false};
async function submit(){
  if($("web").value)return;
  const nm=$("nm").value.trim(),ph=$("ph").value.trim().replace(/[\s-]/g,""),gv=$("gv").value,ad=$("ad").value.trim(),nt=$("nt").value.trim();
  if(nm.length<3)return err("اكتب الاسم بالكامل");
  if(!/^01[0125][0-9]{8}$/.test(ph))return err("رقم الموبايل لازم يكون 11 رقم ويبدأ بـ 01");
  if(!gv)return err("اختار المحافظة");
  if(ad.length<8)return err("اكتب العنوان بالتفصيل (المنطقة والشارع ورقم العمارة)");
  const btn=$("go");btn.disabled=true;btn.textContent="جاري إرسال الطلب...";err("");
  try{
    const r=await post({action:"order",name:nm,phone:ph,gov,address:ad,notes:nt,items:Object.keys(cart).map(c=>({code:c,qty:cart[c]}))});
    if(r.ok){try{localStorage.setItem("ex2cust",JSON.stringify({nm,ph,gv,ad}))}catch(e){}cart={};saveCart();count();done(r.id,ph);loadData()}
    else{btn.disabled=false;btn.textContent="تأكيد الطلب";err(r.msg||"تعذر إرسال الطلب");loadData()}
  }catch(e){btn.disabled=false;btn.textContent="تأكيد الطلب";err("حصلت مشكلة في الاتصال. تأكد من الإنترنت وجرب تاني.")}
}
function done(id,ph){
  $("ptitle").textContent="تم استلام الطلب";
  $("pb").innerHTML=`<div class="done"><div class="ck">&#10003;</div><h2>تم استلام طلبك</h2><p>رقم الطلب</p><div class="no">${esc(id)}</div><p>هنتصل بيك على الرقم ${esc(ph)} لتأكيد الطلب وتفاصيل الشحن.</p><button class="go" id="back">رجوع للمتجر</button></div>`;
  $("back").onclick=closeCart;
}

/* ====== لوحة التحكم (مخفية) ====== */
let taps=0,tapT;
$("logo").onclick=()=>{taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,2500);if(taps>=5){taps=0;openAdmin()}};
addEventListener("hashchange",()=>{if(location.hash==="#admin")openAdmin()});
if(location.hash==="#admin")setTimeout(openAdmin,300);
function openAdmin(){
  history.replaceState(null,"",location.pathname+location.search);
  $("adm").classList.add("show");
  const pw=sessionStorage.getItem("ex2pw");
  if(pw){A.pw=pw;adminLoad()}else loginView();
}
function closeAdmin(){$("adm").classList.remove("show");$("mod").classList.remove("show");loadData()}
function loginView(){
  $("adm").innerHTML=`<div class="ah"><b>دخول الإدارة</b><button id="x1">إغلاق</button></div><div class="ab"><label for="apw">كلمة المرور</label><input id="apw" type="password" autocomplete="current-password"><div class="err" id="aerr"></div><button class="go" id="alog">دخول</button></div>`;
  $("x1").onclick=closeAdmin;
  const go=async()=>{A.pw=$("apw").value;$("alog").disabled=true;if(!await adminLoad(true))$("alog").disabled=false};
  $("alog").onclick=go;$("apw").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function adminLoad(fromLogin){
  try{
    const r=await post({action:"adminData",pw:A.pw});
    if(!r.ok){
      sessionStorage.removeItem("ex2pw");
      if(fromLogin&&$("aerr"))$("aerr").textContent=r.msg||"تعذر الدخول";else loginView();
      return false;
    }
    A.d=r;sessionStorage.setItem("ex2pw",A.pw);adminView();return true;
  }catch(e){
    if($("aerr"))$("aerr").textContent="مشكلة في الاتصال. جرب تاني.";else{toast("مشكلة في الاتصال",1);loginView()}
    return false;
  }
}
function adminView(){
  const nw=A.d.orders.filter(o=>o.status==="جديد").length;
  $("adm").innerHTML=`<div class="ah"><b>لوحة التحكم</b><div><button id="lo">خروج</button> <button id="cl">إغلاق</button></div></div><div class="at"><button data-t="p">المنتجات</button><button data-t="o">الطلبات${nw?" ("+fmt(nw)+")":""}</button><button data-t="s">الإعدادات</button></div><div class="ab" id="abody"></div>`;
  $("cl").onclick=closeAdmin;
  $("lo").onclick=()=>{sessionStorage.removeItem("ex2pw");A.pw="";closeAdmin()};
  document.querySelectorAll(".at button").forEach(b=>{b.classList.toggle("on",b.dataset.t===A.tab);b.onclick=()=>{A.tab=b.dataset.t;adminView()}});
  ({p:prodTab,o:ordTab,s:setTab})[A.tab]();
}

/* --- المنتجات --- */
function prodTab(){
  const q=A.q.trim(),L=A.d.products.filter(p=>!q||(p.name+p.cat).includes(q));
  let h=`<div class="bar2"><input id="pq" placeholder="ابحث في المنتجات" value="${esc(A.q)}"><button id="padd">+ إضافة منتج</button></div>`;
  h+=L.length?L.map(p=>`<div class="ar${p.show?"":" hid"}" data-c="${esc(p.code)}"><div class="top"><div class="th">${/^https:\/\//.test(p.img)?`<img src="${esc(p.img)}" alt="">`:"بدون صورة"}</div><div class="nm"><b>${esc(p.name)}</b><small>${esc(p.cat)} | ${fmt(p.price)} جنيه</small></div><span class="tag${p.stock<=0?" z":""}">${p.stock<=0?"نفد":"المتاح: "+fmt(p.stock)}</span></div><div class="acts"><button data-a="e">تعديل</button><button data-a="v">${p.show?"إخفاء":"إظهار"}</button><button class="dng" data-a="d">حذف</button><label>الكمية <input type="number" min="0" inputmode="numeric" value="${p.stock}" data-a="s"></label></div></div>`).join(""):'<div class="empty">مفيش منتجات. اضغط إضافة منتج.</div>';
  $("abody").innerHTML=h;
  $("pq").oninput=function(){A.q=this.value;const pos=this.selectionStart;prodTab();const n=$("pq");n.focus();n.setSelectionRange(pos,pos)};
  $("padd").onclick=()=>prodForm();
  $("abody").querySelectorAll(".ar").forEach(el=>{
    const p=A.d.products.find(x=>x.code===el.dataset.c);
    el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==="e")prodForm(p);
      if(a==="v")saveProd({...p,show:!p.show},p.show?"تم إخفاء المنتج":"تم إظهار المنتج");
      if(a==="d"&&confirm('حذف "'+p.name+'" نهائيًا؟')){
        const r=await post({action:"deleteProduct",pw:A.pw,code:p.code});
        if(r.ok){toast("تم الحذف");await adminLoad()}else toast(r.msg||"تعذر الحذف",1)}
    });
    el.querySelector("input[data-a=s]").onchange=function(){saveProd({...p,stock:Math.max(0,parseInt(this.value)||0)},"تم تحديث الكمية")};
  });
}
async function saveProd(p,msg){
  try{
    const r=await post({action:"saveProduct",pw:A.pw,product:p});
    if(r.ok){toast(msg||"تم الحفظ");$("mod").classList.remove("show");await adminLoad();return true}
    toast(r.msg||"تعذر الحفظ",1);
  }catch(e){toast("مشكلة في الاتصال",1)}
  return false;
}
function prodForm(p){
  p=p||{};const cats=[...new Set(A.d.products.map(x=>x.cat).filter(Boolean))];let imgData="",img=p.img||"";
  $("modb").innerHTML=`<h3>${p.code?"تعديل منتج":"إضافة منتج"}</h3>
  <label>اسم المنتج</label><input id="fn" value="${esc(p.name||"")}">
  <label>القسم (اختار أو اكتب قسم جديد)</label><input id="fc" list="cl" value="${esc(p.cat||"")}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
  <div class="two"><div><label>السعر (جنيه)</label><input id="fp" type="number" min="0" inputmode="decimal" value="${p.price||""}"></div><div><label>الكمية المتاحة</label><input id="fs" type="number" min="0" inputmode="numeric" value="${p.stock==null?"":p.stock}"></div></div>
  <label>وصف قصير (اختياري)</label><input id="fd" value="${esc(p.desc||"")}">
  <label>صورة المنتج</label><div style="display:flex;gap:12px;align-items:center"><div class="prev" id="pv">${/^https:\/\//.test(img)?`<img src="${esc(img)}" alt="">`:"بدون صورة"}</div><div><input id="ff" type="file" accept="image/*"></div></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fv" ${p.show===false?"":"checked"}> ظاهر في المتجر</label>
  <div class="err" id="ferr"></div><button class="go y" id="fsv">حفظ</button><button class="go ghost" id="fcn">إلغاء</button>`;
  $("mod").classList.add("show");
  $("fcn").onclick=()=>$("mod").classList.remove("show");
  $("ff").onchange=async function(){
    const f=this.files[0];if(!f)return;
    try{imgData=await shrink(f);img="";$("pv").innerHTML=`<img src="${imgData}" alt="">`}catch(e){$("ferr").textContent="تعذر قراءة الصورة"}
  };
  $("fsv").onclick=async()=>{
    const name=$("fn").value.trim(),price=Number($("fp").value),stock=$("fs").value;
    if(name.length<2)return $("ferr").textContent="اكتب اسم المنتج";
    if(!(price>0))return $("ferr").textContent="اكتب السعر";
    if(stock==="")return $("ferr").textContent="اكتب الكمية المتاحة";
    $("fsv").disabled=true;$("fsv").textContent="جاري الحفظ...";
    const ok=await saveProd({code:p.code||"",name,cat:$("fc").value.trim()||"أخرى",desc:$("fd").value.trim(),price,stock:Math.max(0,parseInt(stock)||0),img,imgData,show:$("fv").checked});
    if(!ok){$("fsv").disabled=false;$("fsv").textContent="حفظ"}
  };
}
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.82))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* --- الطلبات --- */
function ordTab(){
  const O=A.d.orders,ST=A.d.statuses;
  $("abody").innerHTML=O.length?O.map(o=>`<div class="ord"><div class="hd2"><span>${esc(o.id)}</span><span>${fmt(o.total)} جنيه</span></div><div style="color:var(--mut);font-size:12px">${esc(o.when)}</div><div>${esc(o.name)} - <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div><div>${esc(o.gov)} | ${esc(o.address)}</div><pre>${esc(o.items)}</pre>${o.notes?`<div>ملاحظات: ${esc(o.notes)}</div>`:""}<label>حالة الطلب</label><select data-id="${esc(o.id)}" data-old="${esc(o.status)}">${ST.map(s=>`<option${s===o.status?" selected":""}>${s}</option>`).join("")}</select></div>`).join(""):'<div class="empty">لسه مفيش طلبات.</div>';
  $("abody").querySelectorAll("select").forEach(s=>s.onchange=async()=>{
    if(s.value==="ملغي"&&!confirm("إلغاء الطلب هيرجّع الكميات للمخزون. متأكد؟")){s.value=s.dataset.old;return}
    const r=await post({action:"setStatus",pw:A.pw,id:s.dataset.id,status:s.value});
    if(r.ok){toast("تم تحديث الحالة");await adminLoad()}else{toast(r.msg||"تعذر التحديث",1);s.value=s.dataset.old}
  });
}

/* --- الإعدادات --- */
function setTab(){
  const s=A.d.settings;
  const f=(k,l,t)=>`<label>${l}</label><input data-k="${k}" ${t||""} value="${esc(s[k]||"")}">`;
  $("abody").innerHTML=`${f("name","اسم المتجر")}${f("phone","رقم التليفون (يظهر للعملاء)",'inputmode="tel"')}${f("wa","رقم الواتساب بصيغة دولية مثال 201012345678",'inputmode="tel"')}${f("ship","مصاريف الشحن بالجنيه (0 = يتحدد في المكالمة)",'type="number" min="0" inputmode="numeric"')}
  <label>استقبال الطلبات</label><select data-k="open"><option value="نعم"${s.open==="لا"?"":" selected"}>شغال</option><option value="لا"${s.open==="لا"?" selected":""}>متوقف مؤقتًا</option></select>
  <button class="go y" id="ssv" style="margin-top:14px">حفظ</button>
  <div class="sec">تغيير كلمة المرور</div><label>كلمة المرور الجديدة (6 على الأقل)</label><input id="np" type="password" autocomplete="new-password"><label>تأكيد كلمة المرور</label><input id="np2" type="password" autocomplete="new-password"><div class="err" id="perr"></div><button class="go" id="psv">تغيير كلمة المرور</button>`;
  $("ssv").onclick=async()=>{
    const o={};document.querySelectorAll("[data-k]").forEach(e=>o[e.dataset.k]=e.value);
    const r=await post({action:"saveSettings",pw:A.pw,settings:o});
    if(r.ok){toast("تم الحفظ");await adminLoad()}else toast(r.msg||"تعذر الحفظ",1)};
  $("psv").onclick=async()=>{
    const a=$("np").value,b=$("np2").value;
    if(a.length<6)return $("perr").textContent="كلمة المرور قصيرة";
    if(a!==b)return $("perr").textContent="كلمتا المرور غير متطابقتين";
    const r=await post({action:"changePw",pw:A.pw,newPw:a});
    if(r.ok){A.pw=a;sessionStorage.setItem("ex2pw",a);$("np").value=$("np2").value="";$("perr").textContent="";toast("تم تغيير كلمة المرور")}else $("perr").textContent=r.msg||"تعذر التغيير"};
}

loadData();count();
</script>
